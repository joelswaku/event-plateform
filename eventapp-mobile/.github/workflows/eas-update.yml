name: EAS Update

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'eventapp-mobile/app/**'
      - 'eventapp-mobile/src/**'
      - 'eventapp-mobile/assets/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      message:
        description: 'Update message'
        required: true
        default: 'OTA update from CI/CD'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: eventapp-mobile/package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        working-directory: eventapp-mobile
        run: npm ci

      - name: 📤 Publish update
        working-directory: eventapp-mobile
        run: |
          CHANNEL=${{ github.event.inputs.channel || 'preview' }}
          MESSAGE="${{ github.event.inputs.message || 'OTA update from CI/CD' }}"

          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            CHANNEL="production"
            MESSAGE="Production update: ${{ github.event.head_commit.message }}"
          fi

          eas update --branch $CHANNEL --message "$MESSAGE" --non-interactive
